[project]
name = "chart-retrieve"
version = "0.1.0"
description = "Production-ready FastAPI backend project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "pydantic[email]",
    "SQLAlchemy[asyncio]",
    "psycopg2-binary",
    "alembic",
    "redis",
    "celery",
    "uvicorn[standard]",
    "python-jose[cryptography]",
    "passlib[argon2]",
    "argon2_cffi",
    "tenacity",
    "structlog",
    "python-json-logger",
    "asyncpg",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "httpx",
    "pre-commit",
]

[tool.ruff]
line-length = 88
